[package]
name = "crab-desktop"
description = "Desktop (egui) frontend for CrabBoy (multi-system)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "CrabBoy"
path = "src/main.rs"

[dependencies]
eframe = "0.28"
rfd = "0.15"
rodio = "0.19"
emu-core = { workspace = true }
crab-systems = { workspace = true }

[features]
# The Nintendo 3DS core (see `crab-systems`).
ctr = ["crab-systems/ctr"]

[build-dependencies]
winresource = "0.1"
