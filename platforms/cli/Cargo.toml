[package]
name = "crab-cli"
description = "Headless runner and test harness for CrabBoy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "crab"
path = "src/bin/crab.rs"

[[bin]]
name = "render_logo"
path = "src/bin/render_logo.rs"
required-features = ["logo-tools"]

[[bin]]
name = "accuracy"
path = "src/bin/accuracy.rs"

[[bin]]
name = "fetch_test_roms"
path = "src/bin/fetch_test_roms.rs"

[[bin]]
name = "gba-diag"
path = "src/bin/gba_diag.rs"

[[bin]]
name = "ctr-diag"
path = "src/bin/ctr_diag.rs"

[[bin]]
name = "gba-disasm"
path = "src/bin/gba_disasm.rs"

[dependencies]
emu-core = { workspace = true }
crab-systems = { workspace = true }
gb-core = { workspace = true }
gba-core = { workspace = true, features = ["trace"] }
ctr-core = { workspace = true, features = ["trace"] }
ureq = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
ico = { version = "0.5", optional = true }
resvg = { version = "0.48", optional = true, default-features = false }
png = "0.18"
toml = "1"

[features]
# Dev tool that rasterises assets/logo.svg into the icon files (pure Rust).
logo-tools = ["dep:resvg", "dep:ico"]
