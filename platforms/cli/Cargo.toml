[package]
name = "crab-cli"
description = "Headless runner and test harness for CrabBoy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "crab"
path = "src/bin/crab.rs"

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "run_accuracy"
path = "src/bin/run_accuracy.rs"

[[bin]]
name = "fetch_test_roms"
path = "src/bin/fetch_test_roms.rs"

[[bin]]
name = "gba-diag"
path = "src/bin/gba_diag.rs"

[[bin]]
name = "gba-disasm"
path = "src/bin/gba_disasm.rs"

[dependencies]
emu-core = { workspace = true }
crab-systems = { workspace = true }
gb-core = { workspace = true }
gba-core = { workspace = true, features = ["trace"] }
ureq = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
