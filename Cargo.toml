[workspace]
resolver = "2"
members = [
    "crates/emu-core",
    "crates/gb-core",
    "crates/gba-core",
    "crates/softfloat",
    "crates/arm-core",
    "crates/teak-dsp",
    "crates/pica",
    "crates/ctr-crypto",
    "crates/ctr-fs",
    "crates/ctr-core",
    "crates/ctr-hle",
    "crates/gdb-stub",
    "crates/crab-systems",
    "platforms/desktop",
    "platforms/cli",
    "platforms/wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SmartyDroidBot/CrabBoy"
rust-version = "1.88"

[workspace.dependencies]
emu-core = { path = "crates/emu-core" }
gb-core = { path = "crates/gb-core" }
gba-core = { path = "crates/gba-core" }
softfloat = { path = "crates/softfloat" }
arm-core = { path = "crates/arm-core" }
teak-dsp = { path = "crates/teak-dsp" }
pica = { path = "crates/pica" }
ctr-crypto = { path = "crates/ctr-crypto" }
ctr-fs = { path = "crates/ctr-fs" }
ctr-core = { path = "crates/ctr-core" }
ctr-hle = { path = "crates/ctr-hle" }
gdb-stub = { path = "crates/gdb-stub" }
crab-systems = { path = "crates/crab-systems" }

[profile.dev]
opt-level = 1

# Shipped binaries: whole-program optimisation, one codegen unit and no
# symbols. panic = "abort" keeps the wasm module small; the cores never
# rely on unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"