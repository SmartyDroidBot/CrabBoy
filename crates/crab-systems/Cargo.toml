[package]
name = "crab-systems"
description = "Console detection and construction for every CrabBoy core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
emu-core = { workspace = true }
gb-core = { workspace = true }
gba-core = { workspace = true }
ctr-core = { workspace = true, optional = true }
ctr-fs = { workspace = true, optional = true }
ctr-hle = { workspace = true, optional = true }

[features]
# The Nintendo 3DS core. Off until the core is ready to merge into `main`.
ctr = ["dep:ctr-core", "dep:ctr-hle", "dep:ctr-fs"]
